<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>测试版解密</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background-color:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:28px 20px 48px}
  h1{font-size:24px;line-height:1.3;margin:8px 0 6px}
  .sub{font-size:14px;line-height:1.7;color:#6e6e73;margin:0 0 20px}
  .card{background-color:#fff;border:1px solid #e5e5ea;border-radius:18px;padding:20px;margin-top:14px}
  label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  label:first-child{margin-top:0}
  input[type="file"]{width:100%;font-size:14px;color:#1d1d1f}
  input[type="password"],input[type="text"]{width:100%;height:44px;padding:0 12px;font-size:16px;color:#1d1d1f;background-color:#f5f5f7;border:1px solid #d2d2d7;border-radius:10px;outline:none}
  input[type="password"]:focus,input[type="text"]:focus{border-color:#0071e3}
  .btn{display:block;width:100%;height:48px;margin-top:20px;border:0;border-radius:999px;background-color:#0071e3;color:#fff;font-size:17px;font-weight:600;cursor:pointer}
  .btn:disabled{background-color:#a7c8ec;cursor:default}
  .file-name{font-size:13px;color:#6e6e73;margin-top:6px;word-break:break-all}
  .msg{font-size:14px;line-height:1.7;margin-top:14px;display:none}
  .msg.err{display:block;color:#d70015}
  .msg.ok{display:block;color:#1d1d1f}
  .msg.ok b{color:#0071e3}
  .result{font-size:13.5px;line-height:1.8;color:#6e6e73;word-break:break-all;margin-top:10px}
  .result code{color:#1d1d1f}
  .foot{font-size:12.5px;line-height:1.7;color:#86868b;margin-top:20px}
  .spin{position:relative;width:28px;height:28px;margin:16px auto 0;display:none}
  .spin.on{display:block}
  .spin i{position:absolute;left:46.5%;top:3%;width:7%;height:26%;border-radius:999px;background-color:#86868b;opacity:.15;transform-origin:50% 177%;animation:aplFade 1.1s linear infinite}
  @keyframes aplFade{0%{opacity:1}55%{opacity:.45}100%{opacity:.15}}
</style>
</head>
<body>
<div class="wrap">
  <h1>测试版解密</h1>
  <p class="sub">下载的测试包是加密文件（.enc），需要群主给你的密码才能解密。解密后得到 .rpk 文件，再用 AstroBox 安装。密码只在你的浏览器里用，不会上传到任何地方。</p>

  <div class="card">
    <label for="encFile">1 · 选择加密文件</label>
    <input type="file" id="encFile" accept=".enc">
    <div class="file-name" id="fileName"></div>

    <label for="pw">2 · 输入密码</label>
    <input type="password" id="pw" autocomplete="off" placeholder="找群主拿密码">

    <button class="btn" id="goBtn">解密</button>
    <div class="spin" id="spin" aria-hidden="true"></div>
    <p class="msg err" id="errMsg"></p>
    <div class="msg ok" id="okMsg"></div>
  </div>

  <p class="foot">加密格式：AES-256-GCM，密钥由密码经 PBKDF2（10 万次，SHA-256）派生。解密后请核对文件名、字节数和 MD5，和测试页上标注的一致再安装。装前先停用小米运动健康。</p>
</div>

<script>
"use strict";
/* ---- MD5（纯 JS，用于解密后核对；已用标准向量验证） ---- */
function md5Hex(bytes){
  var s=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  var K=[0xd76aa478,0xe8c7b756,0x242070db,0xc1bdceee,0xf57c0faf,0x4787c62a,0xa8304613,0xfd469501,0x698098d8,0x8b44f7af,0xffff5bb1,0x895cd7be,0x6b901122,0xfd987193,0xa679438e,0x49b40821,0xf61e2562,0xc040b340,0x265e5a51,0xe9b6c7aa,0xd62f105d,0x02441453,0xd8a1e681,0xe7d3fbc8,0x21e1cde6,0xc33707d6,0xf4d50d87,0x455a14ed,0xa9e3e905,0xfcefa3f8,0x676f02d9,0x8d2a4c8a,0xfffa3942,0x8771f681,0x6d9d6122,0xfde5380c,0xa4beea44,0x4bdecfa9,0xf6bb4b60,0xbebfbc70,0x289b7ec6,0xeaa127fa,0xd4ef3085,0x04881d05,0xd9d4d039,0xe6db99e5,0x1fa27cf8,0xc4ac5665,0xf4292244,0x432aff97,0xab9423a7,0xfc93a039,0x655b59c3,0x8f0ccc92,0xffeff47d,0x85845dd1,0x6fa87e4f,0xfe2ce6e0,0xa3014314,0x4e0811a1,0xf7537e82,0xbd3af235,0x2ad7d2bb,0xeb86d391];
  function add(x,y){return (x+y)|0;}
  function rol(x,c){return (x<<c)|(x>>>(32-c));}
  var len=bytes.length, bitLen=len*8;
  var padded=new Uint8Array((((len+9+63)>>6)<<6));
  padded.set(bytes); padded[len]=0x80;
  var dv=new DataView(padded.buffer);
  dv.setUint32(padded.length-8, bitLen>>>0, true);
  dv.setUint32(padded.length-4, Math.floor(bitLen/4294967296), true);
  var a0=0x67452301,b0=0xefcdab89,c0=0x98badcfe,d0=0x10325476;
  var M=new Array(16);
  for(var off=0;off<padded.length;off+=64){
    for(var i=0;i<16;i++)M[i]=dv.getUint32(off+i*4,true);
    var A=a0,B=b0,C=c0,D=d0;
    for(var j=0;j<64;j++){
      var F,g;
      if(j<16){F=(B&C)|(~B&D);g=j;}
      else if(j<32){F=(D&B)|(~D&C);g=(5*j+1)%16;}
      else if(j<48){F=B^C^D;g=(3*j+5)%16;}
      else{F=C^(B|~D);g=(7*j)%16;}
      F=add(add(F,A),add(K[j],M[g]));
      A=D;D=C;C=B;
      B=add(B,rol(F,s[j]));
    }
    a0=add(a0,A);b0=add(b0,B);c0=add(c0,C);d0=add(d0,D);
  }
  function hex(x){var h='';for(var i=0;i<4;i++)h+=('0'+((x>>>(i*8))&0xff).toString(16)).slice(-2);return h;}
  return hex(a0)+hex(b0)+hex(c0)+hex(d0);
}

/* ---- 解密：文件格式 salt(16) + iv(12) + 密文 + 认证标签(16) ---- */
(function(){
  var fileInput=document.getElementById('encFile');
  var pwInput=document.getElementById('pw');
  var goBtn=document.getElementById('goBtn');
  var spin=document.getElementById('spin');
  var errMsg=document.getElementById('errMsg');
  var okMsg=document.getElementById('okMsg');
  var fileName=document.getElementById('fileName');
  var chosen=null;

  // 齿轮转圈：12 条辐条
  (function(){
    var html='';
    for(var i=0;i<12;i++) html+='<i style="transform:rotate('+(i*30)+'deg);animation-delay:'+(i*0.09167-1.1).toFixed(3)+'s"></i>';
    spin.innerHTML=html;
  })();

  function showErr(t){ errMsg.textContent=t; errMsg.style.display='block'; okMsg.style.display='none'; okMsg.innerHTML=''; }
  function showOk(html){ okMsg.innerHTML=html; okMsg.style.display='block'; errMsg.style.display='none'; errMsg.textContent=''; }

  fileInput.addEventListener('change',function(){
    chosen=fileInput.files&&fileInput.files[0]?fileInput.files[0]:null;
    fileName.textContent=chosen?('已选：'+chosen.name+'（'+chosen.size.toLocaleString('en-US')+' 字节）'):'';
    errMsg.style.display='none'; okMsg.style.display='none';
  });

  goBtn.addEventListener('click',function(){
    if(!chosen){ showErr('请先选择 .enc 加密文件。'); return; }
    var pw=pwInput.value||'';
    if(!pw){ showErr('请输入密码，密码找群主拿。'); return; }
    if(!window.crypto||!crypto.subtle){ showErr('当前浏览器不支持解密，请用最新版 Chrome 打开本页。'); return; }
    goBtn.disabled=true; spin.classList.add('on');
    errMsg.style.display='none'; okMsg.style.display='none';
    chosen.arrayBuffer().then(function(buf){
      if(buf.byteLength<44) throw new Error('format');
      var salt=buf.slice(0,16), iv=buf.slice(16,28), data=buf.slice(28);
      return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey'])
        .then(function(km){
          return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
        })
        .then(function(key){
          return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data);
        });
    }).then(function(plain){
      var name=chosen.name;
      var outName=/\.enc$/i.test(name)?name.replace(/\.enc$/i,''):name+'.rpk';
      var bytes=new Uint8Array(plain);
      var md5=md5Hex(bytes);
      var blob=new Blob([plain],{type:'application/octet-stream'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url; a.download=outName;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
      showOk('解密成功，已开始下载 <b>'+outName+'</b>。<div class="result">文件名：<code>'+outName+'</code><br>字节数：<code>'+bytes.length.toLocaleString('en-US')+'</code><br>MD5：<code>'+md5+'</code><br>请和测试页上标注的核对一致再安装。</div>');
    }).catch(function(e){
      if(e&&e.message==='format') showErr('这不是有效的加密测试包。');
      else showErr('密码错误，请找群主确认密码。');
    }).finally(function(){
      goBtn.disabled=false; spin.classList.remove('on');
    });
  });
})();
</script>
</body>
</html>
